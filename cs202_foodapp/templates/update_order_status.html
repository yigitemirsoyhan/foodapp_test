{% extends "base.html" %}

{% block title %}Order Status Updated{% endblock %}

{% block content %}
<div class="alert alert-success mt-4" role="alert">
    Order #{{ cart_id }} status has been updated to <strong>{{ status }}</strong>.
</div>

<div class="mt-3">
    <a href="{{ url_for('manager_dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
    {% if restaurant_id %}
        <a href="{{ url_for('manage_restaurant', restaurant_id=restaurant_id) }}" class="btn btn-secondary">Back to Restaurant</a>
    {% endif %}
</div>
{% endblock %}
